<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="200" cy="150" r="180" fill="rgba(139, 92, 246, 0.25)" filter="blur(60px)"/>
  <circle cx="600" cy="350" r="150" fill="rgba(249, 115, 22, 0.2)" filter="blur(60px)"/>
  <g transform="translate(400, 210)" text-anchor="middle">
    <circle cx="0" cy="0" r="50" fill="rgba(255, 255, 255, 0.08)" stroke="url(#accentGrad)" stroke-width="2"/>
    <!-- Calendar Icon -->
    <path d="M-18 -12 h36 v28 h-36 z M-12 -20 v10 M12 -20 v10 M-18 -2 h36" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    <text y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#f8fafc">EventSphere Experience</text>
    <text y="108" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94a3b8">Curated Global Events &amp; Workshops</text>
  </g>
</svg>
