<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Icon Symbol -->
  <g transform="translate(4, 4)">
    <circle cx="20" cy="20" r="18" stroke="url(#logoGrad)" stroke-width="2.5" fill="rgba(124, 58, 237, 0.15)"/>
    <ellipse cx="20" cy="20" rx="19" ry="8" stroke="url(#glowGrad)" stroke-width="2" transform="rotate(-25 20 20)"/>
    <circle cx="20" cy="20" r="7" fill="url(#logoGrad)"/>
    <circle cx="26" cy="14" r="2.5" fill="#F97316"/>
  </g>
  <!-- Brand Text -->
  <text x="52" y="31" font-family="'Plus Jakarta Sans', 'Poppins', sans-serif" font-size="24" font-weight="800" fill="currentColor" letter-spacing="-0.5">
    Event<tspan fill="url(#logoGrad)">Sphere</tspan>
  </text>
  <circle cx="192" cy="18" r="3" fill="#F97316"/>
</svg>
